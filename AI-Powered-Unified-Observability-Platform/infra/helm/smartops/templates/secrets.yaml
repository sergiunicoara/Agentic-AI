apiVersion: v1
kind: Secret
metadata:
  name: smartops-secrets
  labels:
    {{- include "smartops.labels" . | nindent 4 }}
type: Opaque
# Values must be supplied via --set or a values override file.
# Example:
#   helm upgrade smartops ./infra/helm/smartops \
#     --set secrets.jwtSecret=<value> \
#     --set secrets.databaseUrl=<value> \
#     --set secrets.anthropicApiKey=<value>
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | default "" | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "smartops_prod" | quote }}
