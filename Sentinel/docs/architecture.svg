<svg viewBox="0 0 1160 800" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel architecture</title>
  <desc id="desc">An ADK orchestrator agent routes user intent into a deterministic seven-stage security-review pipeline. LLM agents sit at the boundaries (orchestrator, scope, attestation, optional LLM auditor); evidence collection, the auditors, and the adjudicator trust gate are deterministic. Every finding must cite evidence from bandit, ruff, pip-audit, or semgrep, or the adjudicator drops it.</desc>

  <rect x="0" y="0" width="1160" height="800" fill="#0a1628"/>

  <!-- ===== header ===== -->
  <text x="48" y="56" fill="#e2e8f0" font-size="30" font-weight="700">🛡 Sentinel</text>
  <text x="48" y="82" fill="#7dd3fc" font-size="16" font-weight="500">Hallucination-free security review — every finding traces to deterministic tool evidence</text>

  <!-- ===== legend ===== -->
  <g font-size="13">
    <rect x="760" y="36" width="16" height="16" rx="3" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="784" y="49" fill="#cbd5e1">LLM agent (ADK · Gemini)</text>
    <rect x="760" y="62" width="16" height="16" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="784" y="75" fill="#cbd5e1">Deterministic (no LLM)</text>
    <rect x="980" y="36" width="16" height="16" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="1004" y="49" fill="#cbd5e1">The trust gate</text>
  </g>

  <!-- ===== user + orchestrator ===== -->
  <g>
    <rect x="48" y="120" width="120" height="56" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="108" y="146" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">User</text>
    <text x="108" y="164" fill="#94a3b8" font-size="11" text-anchor="middle">or A2A peer</text>

    <line x1="168" y1="148" x2="216" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="216" y="112" width="896" height="72" rx="10" fill="#0e7490" stroke="#22d3ee" stroke-width="2"/>
    <text x="236" y="142" fill="#f0f9ff" font-size="18" font-weight="700">SentinelOrchestrator</text>
    <text x="236" y="166" fill="#bae6fd" font-size="13">ADK Agent · Gemini 2.5 Flash — routes user intent to the right tool (8 tools)</text>
    <text x="1092" y="152" fill="#e0f2fe" font-size="12" text-anchor="end" font-style="italic">the only routing LLM</text>
  </g>

  <!-- arrow orchestrator -> pipeline -->
  <line x1="580" y1="184" x2="580" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="208" fill="#94a3b8" font-size="12" font-style="italic">run_sentinel()  ·  deterministic pipeline</text>

  <!-- ===== pipeline container ===== -->
  <rect x="40" y="224" width="1080" height="430" rx="12" fill="#0d1b2f" stroke="#1e3a52" stroke-width="1.5"/>

  <!-- Stage 1: Scope (LLM agent) -->
  <rect x="64" y="252" width="150" height="80" rx="8" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="139" y="280" fill="#f0f9ff" font-size="14" font-weight="700" text-anchor="middle">1 · Scope</text>
  <text x="139" y="300" fill="#bae6fd" font-size="11" text-anchor="middle">ScopeAgent</text>
  <text x="139" y="316" fill="#bae6fd" font-size="11" text-anchor="middle">→ select Skills</text>

  <line x1="214" y1="292" x2="248" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Evidence (deterministic) -->
  <rect x="248" y="252" width="170" height="80" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="333" y="280" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">2 · Evidence</text>
  <text x="333" y="300" fill="#94a3b8" font-size="10.5" text-anchor="middle">MCP server · real transport</text>
  <text x="333" y="315" fill="#7dd3fc" font-size="10.5" text-anchor="middle">bandit·ruff·pip-audit·semgrep</text>

  <line x1="418" y1="292" x2="452" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Auditors (deterministic + 1 LLM) -->
  <rect x="452" y="252" width="190" height="80" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="547" y="278" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">3 · Auditors</text>
  <text x="547" y="296" fill="#94a3b8" font-size="10" text-anchor="middle">Injection · Privilege ·</text>
  <text x="547" y="309" fill="#94a3b8" font-size="10" text-anchor="middle">SupplyChain · RedTeam</text>
  <text x="547" y="324" fill="#7dd3fc" font-size="10" text-anchor="middle">+ LLMAuditor (opt-in) *</text>

  <line x1="642" y1="292" x2="676" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Adjudicator (THE GATE, emphasized) -->
  <rect x="676" y="246" width="200" height="92" rx="8" fill="#172033" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="776" y="274" fill="#fbbf24" font-size="14.5" font-weight="800" text-anchor="middle">4 · Adjudicator</text>
  <text x="776" y="293" fill="#fde68a" font-size="11" font-weight="600" text-anchor="middle">THE TRUST GATE</text>
  <text x="776" y="311" fill="#e2e8f0" font-size="10.5" text-anchor="middle">no evidence_id → DROPPED</text>
  <text x="776" y="326" fill="#e2e8f0" font-size="10.5" text-anchor="middle">real evidence → SURVIVES</text>

  <line x1="876" y1="292" x2="910" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 6: HITL + Stage 7: Attestation, stacked at right -->
  <rect x="910" y="252" width="174" height="38" rx="7" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="997" y="270" fill="#e2e8f0" font-size="12.5" font-weight="700" text-anchor="middle">6 · HITL Gate</text>
  <text x="997" y="284" fill="#94a3b8" font-size="9.5" text-anchor="middle">human approval for fixes</text>

  <rect x="910" y="296" width="174" height="42" rx="7" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="997" y="314" fill="#f0f9ff" font-size="12.5" font-weight="700" text-anchor="middle">7 · Attestation</text>
  <text x="997" y="328" fill="#bae6fd" font-size="9.5" text-anchor="middle">AttestationAgent · signed verdict</text>

  <!-- Red team feeding evidence into auditors -->
  <rect x="452" y="372" width="190" height="74" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="547" y="397" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Red Team (opt-in)</text>
  <text x="547" y="414" fill="#94a3b8" font-size="10" text-anchor="middle">static surface match</text>
  <text x="547" y="429" fill="#7dd3fc" font-size="10" text-anchor="middle">+ live sandboxed execution</text>
  <line x1="547" y1="372" x2="547" y2="332" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="560" y="356" fill="#64748b" font-size="9.5" font-style="italic">trajectory evidence</text>

  <!-- Evidence store note -->
  <text x="333" y="392" fill="#64748b" font-size="11" text-anchor="middle" font-style="italic">every Evidence item</text>
  <text x="333" y="407" fill="#64748b" font-size="11" text-anchor="middle" font-style="italic">gets a unique evidence_id</text>
  <text x="333" y="422" fill="#64748b" font-size="11" text-anchor="middle" font-style="italic">findings must cite one</text>

  <!-- gate explainer -->
  <text x="776" y="372" fill="#94a3b8" font-size="11" text-anchor="middle" font-style="italic">candidate findings in →</text>
  <text x="776" y="388" fill="#94a3b8" font-size="11" text-anchor="middle" font-style="italic">only evidence-backed out</text>

  <!-- footnote inside container -->
  <text x="64" y="486" fill="#7dd3fc" font-size="11.5">* LLMAuditor is the only auditor that can hallucinate — which is exactly why the gate exists.</text>
  <text x="64" y="506" fill="#64748b" font-size="11.5">  The other auditors are deterministic lookups over tool output and cannot emit an unsupported finding.</text>

  <!-- ===== outputs row ===== -->
  <line x1="580" y1="514" x2="580" y2="548" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="64" y="552" width="1020" height="80" rx="10" fill="#0d1b2f" stroke="#1e3a52" stroke-width="1.5"/>
  <text x="84" y="578" fill="#e2e8f0" font-size="14" font-weight="700">Outputs</text>
  <text x="84" y="602" fill="#94a3b8" font-size="12">Verdict: pass · pass_with_findings · fail  —  signed, immutable audit trail</text>
  <text x="84" y="620" fill="#7dd3fc" font-size="12">SARIF 2.1.0 report (CI gate)   ·   A2A HTTP API   ·   HITL approval log</text>

  <!-- results chips -->
  <g font-size="12" font-weight="700">
    <rect x="620" y="566" width="135" height="52" rx="8" fill="#172033" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="687" y="588" fill="#7dd3fc" font-size="20" text-anchor="middle">6/6</text>
    <text x="687" y="606" fill="#cbd5e1" font-size="10.5" text-anchor="middle" font-weight="500">targets detected</text>

    <rect x="767" y="566" width="135" height="52" rx="8" fill="#172033" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="834" y="588" fill="#7dd3fc" font-size="20" text-anchor="middle">0%</text>
    <text x="834" y="606" fill="#cbd5e1" font-size="10.5" text-anchor="middle" font-weight="500">hallucination rate</text>

    <rect x="914" y="566" width="155" height="52" rx="8" fill="#172033" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="991" y="588" fill="#7dd3fc" font-size="20" text-anchor="middle">73</text>
    <text x="991" y="606" fill="#cbd5e1" font-size="10.5" text-anchor="middle" font-weight="500">tests passing</text>
  </g>

  <!-- footer -->
  <text x="48" y="700" fill="#475569" font-size="12">Kaggle AI Agents Intensive Capstone · Track: Agents for Business · Google ADK + Gemini 2.5 Flash on Vertex AI</text>
  <text x="48" y="722" fill="#475569" font-size="12">Course concepts: multi-agent ADK system · MCP server · Agent Skills · security features · deployability</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
