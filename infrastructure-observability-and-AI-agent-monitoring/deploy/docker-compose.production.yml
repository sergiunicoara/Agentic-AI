services:
  # backend and frontend publish no host ports here: the base compose file
  # leaves them unpublished and docker-compose.override.yml (development only)
  # is not loaded by this invocation. Compose appends to sequence fields, so
  # `ports: []` would not have removed anything.
  otel-collector:
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    volumes:
      - ./otel/otel-collector-production.yaml:/etc/otel/config.yaml:ro
      - otel_data:/var/lib/otel

  caddy:
    image: caddy:2.8-alpine
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs/agent-ca.pem:/etc/caddy/agent-ca.pem:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
