name: hybrid_rrf
description: >
  pgvector hybrid retrieval (dense + lexical) explicitly fused with RRF and
  MMR-reranked. Previously left mode/fusion/rerank unset, so it silently
  inherited whatever RETRIEVAL_MODE/FUSION_METHOD/RERANK_MODE happened to
  be in the environment (the same defaults baseline.yaml also falls back
  to) instead of declaring the configuration its name promises — an
  experiment YAML that isn't self-contained isn't reproducible.
retrieval:
  mode: hybrid
  fusion: rrf
  rerank: mmr
  k: 10
  rerank_candidates: 50
metrics:
  - recall_at_k
  - mrr
  - groundedness
  - pass_rate
gates:
  pass_rate: 0.80
  recall_mean: 0.50
  mrr_mean: 0.25
  groundedness_mean: 0.70
  rubric_pass_rate: 0.80
  generation_failure_rate: 0.05
  hard_negative_hit_rate: 0.20
  latency_p95_ms: 800
