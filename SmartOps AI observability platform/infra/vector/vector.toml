# Vector — Log pipeline: Docker → transform → Elasticsearch

[api]
enabled = true
address = "0.0.0.0:8686"

# ── Sources ───────────────────────────────────────────────────
[sources.docker_logs]
type = "docker_logs"
docker_host = "unix:///var/run/docker.sock"
exclude_containers = ["smartops-vector"]

# ── Transforms ───────────────────────────────────────────────
[transforms.parse_json]
type = "remap"
inputs = ["docker_logs"]
source = '''
  # Try to parse the message as JSON; fall back to raw string
  parsed, err = parse_json(.message)
  if err == null {
    . = merge(., parsed)
  }

  # Normalize fields
  .service = del(.container_name) ?? "unknown"
  .service = replace(.service, "/", "")
  .region = get_env_var("SMARTOPS_REGION") ?? "local"
  .environment = "local"
  .@timestamp = to_string(now())
'''

[transforms.add_metadata]
type = "remap"
inputs = ["parse_json"]
source = '''
  .log_level = downcase(string(.level ?? .severity ?? "info"))
  .host = .host ?? "smartops-local"
'''

# ── Sinks ─────────────────────────────────────────────────────
[sinks.elasticsearch]
type = "elasticsearch"
inputs = ["add_metadata"]
endpoints = ["http://elasticsearch:9200"]
mode = "bulk"
index = "smartops-logs-%Y.%m.%d"
compression = "none"
healthcheck.enabled = true

[sinks.elasticsearch.encoding]
except_fields = ["source_type", "stream"]
