# Vector — Log pipeline: Docker → transform → Elasticsearch

[api]
enabled = true
address = "0.0.0.0:8686"

# ── Sources ───────────────────────────────────────────────────
[sources.docker_logs]
type = "docker_logs"
docker_host = "unix:///var/run/docker.sock"
exclude_containers = ["smartops-vector", "smartops-es", "smartops-vm", "smartops-grafana", "smartops-otel", "smartops-alertmanager", "smartops-vmalert"]

# ── Transforms ───────────────────────────────────────────────
[transforms.parse_json]
type = "remap"
inputs = ["docker_logs"]
source = '''
  parsed = parse_json(.message) ?? {}
  . = merge!(., parsed)
  .service = if exists(.container_name) { replace(string!(.container_name), "/", "") } else { "unknown" }
  del(.container_name)
  .region = "local"
  .environment = "local"
  del(.label)
  del(.container_id)
  del(.image)
'''

[transforms.add_metadata]
type = "remap"
inputs = ["parse_json"]
source = '''
  .log_level = downcase(string!(.level || .severity || "info"))
  .host = string!(.host || "smartops-local")
'''

# ── Sinks ─────────────────────────────────────────────────────
[sinks.elasticsearch]
type = "elasticsearch"
inputs = ["add_metadata"]
endpoints = ["http://elasticsearch:9200"]
mode = "bulk"
compression = "none"
healthcheck.enabled = true

[sinks.elasticsearch.bulk]
index = "smartops-logs-%Y.%m.%d"

[sinks.elasticsearch.encoding]
except_fields = ["source_type", "stream", "label"]
