case_id: off_by_one_pagination
difficulty: easy
failure_family: silent_wrong_result
exception_type:
message_pattern: 4, 5, 6
decoy_expected_reason: PASSES_ON_BUGGY
description: get_page() computes start = page_number * page_size instead of (page_number - 1) * page_size, so every page returns the following page's items instead of its own.
