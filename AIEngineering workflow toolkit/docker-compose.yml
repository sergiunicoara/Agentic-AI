services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AIWT_DATA_DIR=/data
    volumes:
      # Persist the SQLite review database across container restarts
      - aiwt_db:/data
    restart: unless-stopped

volumes:
  aiwt_db:
