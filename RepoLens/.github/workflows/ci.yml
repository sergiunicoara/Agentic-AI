name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex
          POSTGRES_DB: codex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex -d codex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://codex:codex@localhost:5432/codex
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Apply migrations
        run: |
          psql "postgresql://codex:codex@localhost:5432/codex" -f migrations/001_init.sql
          psql "postgresql://codex:codex@localhost:5432/codex" -f migrations/002_add_file_content.sql
          psql "postgresql://codex:codex@localhost:5432/codex" -f migrations/003_integrity_and_vector_index.sql
          psql "postgresql://codex:codex@localhost:5432/codex" -f migrations/004_scope_messages_to_repo.sql
        env:
          PGPASSWORD: codex

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: >-
          mypy app/retrieval/citations.py app/retrieval/models.py
          app/ingest/models.py app/browse/models.py --ignore-missing-imports

      - name: Pytest
        run: pytest -q

  eval-objective:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex
          POSTGRES_DB: codex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex -d codex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://codex:codex@localhost:5432/codex
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Apply migrations
        run: |
          psql "postgresql://codex:codex@localhost:5432/codex" -f migrations/001_init.sql
          psql "postgresql://codex:codex@localhost:5432/codex" -f migrations/002_add_file_content.sql
          psql "postgresql://codex:codex@localhost:5432/codex" -f migrations/003_integrity_and_vector_index.sql
          psql "postgresql://codex:codex@localhost:5432/codex" -f migrations/004_scope_messages_to_repo.sql
        env:
          PGPASSWORD: codex

      - name: Run deterministic objective evaluation tests
        run: pytest -q tests/test_evals_metrics.py tests/test_evals_judge.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  eval-live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex
          POSTGRES_DB: codex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex -d codex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://codex:codex@localhost:5432/codex
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_MODEL: claude-sonnet-4-6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Apply migrations
        run: |
          psql "postgresql://codex:codex@localhost:5432/codex" -f migrations/001_init.sql
          psql "postgresql://codex:codex@localhost:5432/codex" -f migrations/002_add_file_content.sql
          psql "postgresql://codex:codex@localhost:5432/codex" -f migrations/003_integrity_and_vector_index.sql
          psql "postgresql://codex:codex@localhost:5432/codex" -f migrations/004_scope_messages_to_repo.sql
        env:
          PGPASSWORD: codex
      - name: Require API secrets
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$ANTHROPIC_API_KEY"
      - name: Ingest demo repository
        run: python -m app.ingest https://github.com/fastapi/fastapi.git --subdir fastapi
      - name: Run real-model evaluation
        run: >-
          python -m app.evals ../evals/golden.yaml
          --source-url https://github.com/fastapi/fastapi.git
          --results-dir ../evals/results-live
